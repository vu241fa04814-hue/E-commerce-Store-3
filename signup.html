<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account - VK's</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="login-page signup-page">
    <main class="login-container">
      <div class="login-avatar" aria-hidden="true">
        <svg viewBox="0 0 64 64">
          <circle cx="27" cy="21" r="10" />
          <path d="M10 51c2-12 10-19 17-19s15 7 17 19H10z" />
          <path d="M49 23v18M40 32h18" />
        </svg>
      </div>
      <h1>Create Account</h1>

      <form id="signup-form" novalidate>
        <label class="login-field" for="name">
          <span class="field-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="8" r="4" />
              <path d="M4 21c1-5 4-7 8-7s7 2 8 7" />
            </svg>
          </span>
          <input type="text" id="name" name="name" placeholder="Full name" autocomplete="name" required />
        </label>

        <label class="login-field" for="email">
          <span class="field-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M3 6h18v12H3z" />
              <path d="m3 7 9 7 9-7" />
            </svg>
          </span>
          <input type="email" id="email" name="email" placeholder="Email address" autocomplete="email" required />
        </label>

        <label class="login-field" for="password">
          <span class="field-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <rect x="5" y="10" width="14" height="10" rx="2" />
              <path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3" />
            </svg>
          </span>
          <input type="password" id="password" name="password" placeholder="Password (at least 6 characters)" autocomplete="new-password" minlength="6" required />
        </label>

        <label class="login-field" for="confirm-password">
          <span class="field-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <rect x="5" y="10" width="14" height="10" rx="2" />
              <path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3" />
            </svg>
          </span>
          <input type="password" id="confirm-password" name="confirmPassword" placeholder="Confirm password" autocomplete="new-password" required />
        </label>

        <button id="signup-button" type="submit">Create Account</button>
      </form>

      <p id="message" role="status" aria-live="polite"></p>
      <p class="switch-form">Already have an account? <a href="login.html">Log in</a></p>
      <p class="switch-form"><a href="index.html">Back to store</a></p>
    </main>

    <script src="signup.js"></script>
  </body>
</html>
